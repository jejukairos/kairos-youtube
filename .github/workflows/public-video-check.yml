name: Kairos public video diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-video:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check-public-video.py
