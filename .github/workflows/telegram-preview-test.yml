name: Telegram YouTube preview test
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Previously delivered video ID; reuse saved summary once
        type: string
        required: true
        default: QslXeEZ0tPI
permissions:
  contents: write
concurrency:
  group: kairos-youtube-state
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Send separate YouTube card and saved summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: python -m kairos_youtube --git-state preview-test --video-id "$VIDEO_ID"
