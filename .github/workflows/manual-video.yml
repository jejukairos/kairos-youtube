name: Summarize requested YouTube video
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Canonical public video URL explicitly requested by the owner
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: kairos-youtube-state
  cancel-in-progress: false
jobs:
  summarize:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Analyze only the requested video under the shared free limits
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FREE_TIER_CONFIRMATION: ${{ secrets.FREE_TIER_CONFIRMATION }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: python -m kairos_youtube --git-state submit --video-url "$VIDEO_URL" --metadata-file docs/manual-video-metadata.json
